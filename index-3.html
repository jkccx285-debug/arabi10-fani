<style>
:root{--ink:#14283a;--bg:#f2f5f8;--card:#fff;--lap:#1d4f91;--gold:#9a6f10;--ok:#1f7a5c;--bad:#b3392f;--line:#d8e0e8;--soft:#e8eff7}
@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--bg:#0f1a24;--card:#17252f;--lap:#7db1f0;--gold:#e0b04a;--ok:#4cc29a;--bad:#f08075;--line:#2a3b49;--soft:#1f3040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 Vazirmatn,Tahoma,sans-serif}
.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic',serif;font-size:1.4rem;line-height:2.3;direction:rtl}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;max-width:960px;margin:auto}
nav button{flex:none;border:0;background:none;color:var(--ink);font:inherit;font-size:.92rem;padding:4px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--lap);color:#fff}
.wrap{max-width:900px;margin:auto;padding:12px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
h1{font-size:1.6rem;margin:.3em 0}h2{font-size:1.2rem;margin:.2em 0 .4em;color:var(--lap)}h3{font-size:1.02rem;margin:.6em 0 .2em}
.hero{padding:28px 10px;text-align:center}.hero .ar{font-size:2.4rem;color:var(--gold);margin:0}
.muted{color:var(--ink);opacity:.7;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer}
.tile:hover{border-color:var(--lap)}.tile b{display:block}
.btn{border:1px solid var(--lap);background:var(--lap);color:#fff;font:inherit;border-radius:8px;padding:4px 16px;cursor:pointer}
.btn.alt{background:none;color:var(--lap)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}th{background:var(--soft)}
td.ar,th.ar{font-size:1.25rem;line-height:1.9}
input[type=text],input[type=search],input:not([type]){font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%;max-width:320px}
.opt{display:block;width:100%;text-align:right;margin:6px 0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.fc{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.3rem;cursor:pointer;border:2px solid var(--lap);border-radius:12px;padding:14px}
.fc .ar{font-size:2rem}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details{margin:6px 0}summary{cursor:pointer;color:var(--lap)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

var L=[
{t:'كَدُّ الْيَدِ',f:'دسترنج',q:'حِرْفَةُ الْمَرْءِ كَنْزٌ',qf:'پیشهٔ انسان گنج است. (امام علی ع)',
 text:['يَشْعُرُ ناصِرٌ الْيَوْمَ بِالتَّعَبِ كَثيراً. فَهُوَ سائِقُ سَيّارَةِ أُجْرَةٍ وَ يَكْسِبُ مَصاريفَ حَياتِهِ عَنْ طَريقِ نَقْلِ الْمُسافِرينَ. وَ قَدْ حَصَلَ عَلى مالٍ جَيِّدٍ وَ لكِنَّهُ شَعَرَ بِالتَّعَبِ.','قالَ رَسولُ اللّهِ (ص): «إِنَّ اللّهَ يُحِبُّ الَّذينَ يَعْمَلونَ وَ يَنْفَعونَ الْآخَرينَ وَ هُمْ في طَلَبِ الرِّزْقِ الْحَلالِ.»','«مَنْ أَكَلَ مِنْ كَدِّ يَدِهِ نَظَرَ اللّهُ إِلَيْهِ بِالرَّحْمَةِ، ثُمَّ لا يُعَذِّبُهُ أَبَداً.»'],
 tr:'ناصر امروز بسیار خسته است. او راننده تاکسی است و هزینهٔ زندگی‌اش را با جابه‌جایی مسافران درمی‌آورد. درآمد خوبی داشته اما احساس خستگی کرده است. پیامبر (ص) فرمود: خداوند کسانی را دوست دارد که کار می‌کنند و به دیگران سود می‌رسانند، در حالی که در پی روزی حلال‌اند؛ و هر کس از دسترنج خود بخورد، خدا با رحمت به او می‌نگرد و هرگز عذابش نمی‌کند.',
 g:'<b>مرور آموخته‌های قبل:</b> جدول ۱۴ صیغه (ضمیر، ماضی، مضارع، امر، نهی). برای تمرین با هر ریشهٔ دلخواه، به تب «صرف» بروید. «تَرْجِمْ» یعنی «ترجمه کن».'},
{t:'يَدُ الْفَلّاحِ',f:'دست کشاورز',q:'اِزْرَعوا وَ اغْرِسوا … وَ اللّهِ ما عَمِلَ النّاسُ عَمَلاً أَحَلَّ وَ لا أَطْيَبَ مِنْهُ',qf:'کشاورزی کنید و نهال بکارید … به خدا سوگند مردم کاری حلال‌تر و بهتر از آن انجام نداده‌اند. (امام صادق ع)',
 text:['تُوجَدُ قِصَصٌ كَثيرَةٌ في تاريخِ الْإِسْلامِ تُبَيِّنُ قيمَةَ الْعَمَلِ؛ مِنْها: كانَ النَّبِيُّ (ص) جالِساً مَعَ خَمْسَةٍ مِنْ أَصْحابِهِ تَحْتَ شَجَرَةٍ؛ فَدَخَلَ عَلَيْهِمْ رَجُلٌ ذو وَجْهٍ أَسْمَرَ وَ يَدَيْنِ خَشِنَتَيْنِ؛ فَفَهِمَ الْحاضِرونَ مِنْ ظاهِرِهِ أَنَّهُ فَلّاحٌ وَ مِهْنَتُهُ الزِّراعَةُ.','فَضَحِكَ أَحَدٌ مِنَ الْحاضِرينَ وَ أَرادَ أَنْ يَسْتَهْزِئَ بِهِ؛ وَ لكِنَّ النَّبِيَّ (ص) عِنْدَما شاهَدَهُ رَحَّبَ بِهِ وَ أَجْلَسَهُ إِلى جانِبِهِ. ثُمَّ تَعَجَّبوا كَثيراً حينَما أَخَذَ رَسولُ اللّهِ يَدَ الْفَلّاحِ بِيَدِهِ وَ قالَ: «إِنَّها يَدٌ يُحِبُّها اللّهُ وَ رَسولُهُ».','رَحِمَ اللّهُ امْرَأً عَمِلَ عَمَلاً فَأَتْقَنَهُ. (رَسولُ اللّهِ) — آفَةُ النُّجْحِ الْكَسَلُ. (الْإِمامُ عَلِيٌّ)'],
 tr:'در تاریخ اسلام داستان‌های بسیاری ارزش کار را نشان می‌دهد. پیامبر با پنج یاران زیر درختی نشسته بود که مردی گندمگون با دو دست زبر وارد شد. حاضران از ظاهرش فهمیدند کشاورز است. یکی خندید و خواست او را مسخره کند، اما پیامبر به او خوشامد گفت و کنارش نشاند و سپس دست او را در دست گرفت و فرمود: «این دستی است که خدا و رسولش دوستش دارند». همچنین: خدا رحمت کند کسی را که کاری را انجام دهد و آن را درست و استوار انجام دهد. / آفتِ موفقیت، تنبلی است.',
 g:'<b>اعداد اصلی ۱ تا ۱۰۰ و ترتیبی ۱ تا ۲۰</b> در این درس آموزش داده می‌شود. مطابقت عدد و معدود جزء اهداف کتاب نیست. ابزار تبدیل عدد در تب «اعداد» است.'},
{t:'قيمَةُ الْعَمَلِ',f:'ارزش کار',q:'إِنَّ اللّهَ جَميلٌ يُحِبُّ الْجَمالَ',qf:'خداوند زیباست و زیبایی را دوست دارد. (رسول خدا ص)',
 text:['عِنْدَما رَجَعَ رَسولُ اللّهِ مِنْ إِحْدى الْغَزَواتِ، اِسْتَقْبَلَهُ أَحَدُ أَصْحابِهِ بِاسْمِ «سَعْدٍ الْأَنْصاري»، فَصافَحَهُ النَّبِيُّ وَ وَجَدَ يَدَهُ خَشِنَةً؛ ثُمَّ سَأَلَهُ: لِماذا يَدُكَ هكَذا؟','أَجابَ: يا رَسولَ اللّهِ، أَشْتَغِلُ في الْمَزْرَعَةِ مِنَ الصَّباحِ حَتّى اللَّيْلِ لِنَفَقَةِ أَهْلي. فَقَبَّلَ رَسولُ اللّهِ يَدَهُ وَ قالَ: «هذِهِ يَدٌ لا تَمَسُّها النّارُ أَبَداً».'],
 tr:'وقتی پیامبر از یکی از جنگ‌ها برگشت، یکی از یارانش به نام «سعد انصاری» به استقبالش آمد. پیامبر با او دست داد و دستش را زبر یافت و پرسید: چرا دستت این‌گونه است؟ پاسخ داد: ای رسول خدا، از صبح تا شب در مزرعه کار می‌کنم تا خرج خانواده‌ام را تأمین کنم. پیامبر دست او را بوسید و فرمود: «این دستی است که آتش هرگز آن را لمس نمی‌کند».',
 g:'<b>افعالی با ماضی سوم‌شخص مفرد بیش از سه حرف:</b> ۴ وزن را با مضارع و مصدر حفظ کنید.<br>شناسه‌ها در ماضی: «ـتُ» = انجام دادم، «ـتَ» = دادی، «ـَ» = داد، «ـنا» = دادیم، «ـتُمْ» = دادید، «ـوا» = دادند. در مضارع: «أ» (من)، «تـ» (تو)، «يـ» (او)، «نـ» (ما)، «تـ…ونَ» (شما)، «يـ…ونَ» (آنان).<br>تمرین وزن‌ها در تب «صرف».'},
{t:'هذا خَلْقُ اللّهِ',f:'این آفرینش خداست',q:'﴿قُلْ سيروا فِي الْأَرْضِ فَانْظُروا كَيْفَ بَدَأَ الْخَلْقَ﴾',qf:'بگو در زمین بگردید و بنگرید چگونه [خداوند] آفرینش را آغاز کرد. (عنکبوت ۲۰)',
 text:['في أَعْماقِ الْبَحْرِ تُوجَدُ أَسْماكٌ مُضيئَةٌ. وَ أَضواؤُها صادِرَةٌ عَنْ نَوْعٍ مِنَ الْبَكْتيرْيا الْمُضيئَةِ الَّتي تَعيشُ تَحْتَ عُيونِ تِلْكَ الْأَسْماكِ.','تَسْتَطيعُ الْحِرْباءُ أَنْ تُديرَ عَيْنَيْها في اتِّجاهاتٍ مُخْتَلِفَةٍ دونَ أَنْ تُحَرِّكَ رَأْسَها، وَ هِيَ تَسْتَطيعُ أَنْ تَرى في اتِّجاهَيْنِ في وَقْتٍ واحِدٍ.','لا تَتَحَرَّكُ عَيْنُ الْبومَةِ، فَإِنَّها ثابِتَةٌ، وَ لكِنَّها تُعَوِّضُ هذَا النَّقْصَ بِتَحْريكِ رَأْسِها في كُلِّ جِهَةٍ، وَ تَسْتَطيعُ أَنْ تُديرَ رَأْسَها مِئَتَيْنِ وَ سَبْعينَ دَرَجَةً دونَ أَنْ تُحَرِّكَ جِسْمَها.'],
 tr:'در اعماق دریا ماهی‌های نورانی هستند و نورشان از نوعی باکتری نورانی است که زیر چشم‌های آن ماهی‌ها زندگی می‌کند. آفتاب‌پرست می‌تواند بدون حرکت دادن سر، چشمانش را در جهت‌های مختلف بچرخاند و هم‌زمان در دو جهت ببیند. چشم جغد حرکت نمی‌کند و ثابت است، اما این کاستی را با چرخاندن سرش جبران می‌کند: سر خود را ۲۷۰ درجه، بدون حرکت دادن بدن، می‌چرخاند. (متن کامل درس شامل جانوران دیگر نیز هست.)',
 g:'<b>چهار وزن دیگر:</b> تَفاعَلَ، فَعَّلَ، فاعَلَ، أَفْعَلَ. مثال‌ها: تَعارَفَ (آشنا شد)، فَتَّشَ (بازرسی کرد)، جاهَدَ (کوشید)، أَحْسَنَ (نیکی کرد). مصدرها را در تب «صرف» ببینید.'}
];

 }
 var q=Q[z.o[z.i]];
 return '<div class="card"><div class="bar"><i style="width:'+Math.round(z.i/z.o.length*100)+'%"></i></div><p class="muted">پرسش '+fa(z.i+1)+' از '+fa(z.o.length)+' · امتیاز: '+fa(z.s)+'</p><h2 style="color:inherit">'+q[0]+'</h2>'+
 q[1].map(function(o,k){var c='opt';if(z.sel!==null){if(k===q[2])c+=' ok';else if(k===z.sel)c+=' bad'}return '<button class="'+c+'" data-a="opt" data-k="'+k+'"'+(z.sel!==null?' disabled':'')+'>'+o+'</button>'}).join('')+
 (z.sel!==null?'<p aria-live="polite"><b>'+(z.sel===q[2]?'✔ درست':'✘ نادرست — پاسخ درست: '+q[1][q[2]])+'</b></p><button class="btn" data-a="qnext">'+(z.i+1===z.o.length?'پایان':'پرسش بعدی')+'</button>':'')+'</div>';
}
function render(){
 nav();
 var v=S.v,h;
 if(v==='home')h=home();else if(v.charAt(0)==='l')h=lesson(+v.charAt(1));else if(v==='num')h=numbers();else if(v==='verb')h=verbs();else if(v==='vocab')h=vocabView();else h=quiz();
 $('#app').innerHTML=h;
 if(v==='vocab')drawFc();
}
function go(v){S.v=v;render();window.scrollTo(0,0)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- رویدادها ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-v],[data-a]');if(!t)return;
 if(t.dataset.v){go(t.dataset.v);return}
 var a=t.dataset.a,f=S.fc;
 if(a==='flip'){f.flip=!f.flip;drawFc()}
 else if(a==='next'||a==='prev'){var n=f.deck.filter(function(i){return !f.onlyNew||!known[i]}).length;f.i=a==='next'?(f.i+1)%n:(f.i-1+n)%n;f.flip=false;drawFc()}
 else if(a==='know'){var d=f.deck.filter(function(i){return !f.onlyNew||!known[i]}),id=d[f.i];if(known[id])delete known[id];else known[id]=1;store.set('arab10.known',known);if(f.onlyNew&&known[id]&&f.i>=d.length-1)f.i=0;f.flip=false;drawFc()}
 else if(a==='shuffle'){shuffle(f.deck);f.i=0;f.flip=false;drawFc()}
 else if(a==='onlyNew'||a==='fcAll'){f.onlyNew=a==='onlyNew'&&!f.onlyNew;f.i=0;f.flip=false;drawFc()}
 else if(a==='qstart'){S.qz={o:shuffle(Q.map(function(_,i){return i})),i:0,s:0,sel:null};render()}
 else if(a==='opt'&&S.qz&&S.qz.sel===null){var k=+t.dataset.k,q=Q[S.qz.o[S.qz.i]];S.qz.sel=k;if(k===q[2])S.qz.s++;render()}
 else if(a==='qnext'&&S.qz){S.qz.i++;S.qz.sel=null;if(S.qz.i>=S.qz.o.length&&S.qz.s>best){best=S.qz.s;store.set('arab10.best',best)}render();window.scrollTo(0,0)}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a==='flip'){e.preventDefault();e.target.click()}});
document.addEventListener('input',function(e){
 var id=e.target.id,v=e.target.value;
 if(id==='numIn'){var n=parseInt(v.replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}),10);$('#numOut').textContent=(n>=1&&n<=100)?numWord(n):'عددی از ۱ تا ۱۰۰ وارد کنید.'}
 else if(id==='rootIn'){var r=cleanRoot(v);$('#verbOut').innerHTML=validRoot(r)?(S.root=r,verbTables(r)):'<p>فقط سه حرف عربی وارد کنید؛ مثلاً: كتب</p>'}
 else if(id==='vSearch'){var s=v.trim().toLowerCase(),c=cleanRoot(v);var list=V.filter(function(w){return !s||w[1].toLowerCase().indexOf(s)>-1||cleanRoot(w[0]).indexOf(c)>-1});$('#vList').innerHTML=list.length?vocabTable(list):'<p>واژه‌ای پیدا نشد.</p>'}
});
render();
})();
</script>
</body>
